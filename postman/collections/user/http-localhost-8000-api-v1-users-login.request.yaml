name: http://localhost:8000/api/v1/users/login
description: ""
url: http://localhost:8000/api/v1/users/login
method: POST
headers:
  Authorization: "{{bearer_token_1cz5}}"
body:
  type: json
  content: "{\r

    \    \"email\": \"sachinpandey3428282@gmail.com\",\r

    \    \"otp\": 863291,\r

    \    \"password\": \"1122334411\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is less than 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });

      pm.test("Response body is valid JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Password reset was successful", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.message).to.eql("Password changed successfully");
          pm.expect(jsonData.statusCode).to.eql(200);
      });
